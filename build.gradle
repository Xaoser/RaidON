import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

plugins {
    id 'architectury-plugin' version '3.4.162'
    id 'dev.architectury.loom' version '1.7.435' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

if (System.getProperty('fabric.loom.ci') == null) {
    System.setProperty('fabric.loom.ci', 'true')
}

ext.set("loom_fabric_repository", "https://repo.spongepowered.org/repository/maven-public/")

def repositoryMirrorUrl = uri('https://repo.spongepowered.org/repository/maven-public/')
def patchMcpConfigText = { String text ->
    text.replaceAll(/"repo"\s*:\s*"[^"]*"/, '"repo": null')
}

def patchMcpConfigFile = { File file ->
    if (!file.exists()) {
        return false
    }

    def original = file.getText('UTF-8')
    def patched = patchMcpConfigText(original)

    if (patched == original) {
        return false
    }

    file.setText(patched, 'UTF-8')
    return true
}

def patchMcpConfigZip = { File file ->
    if (!file.exists()) {
        return false
    }

    def tempPath = Files.createTempFile(file.parentFile.toPath(), "${file.name}.", '.tmp')
    def changed = false

    ZipFile zipFile = new ZipFile(file)
    ZipOutputStream zipOutputStream = new ZipOutputStream(Files.newOutputStream(tempPath))

    try {
        zipFile.entries().each { ZipEntry entry ->
            def newEntry = new ZipEntry(entry.name)
            newEntry.time = entry.time
            zipOutputStream.putNextEntry(newEntry)

            if (!entry.isDirectory()) {
                byte[] bytes = zipFile.getInputStream(entry).bytes

                if (entry.name == 'config.json') {
                    def original = new String(bytes, StandardCharsets.UTF_8)
                    def patched = patchMcpConfigText(original)

                    if (patched != original) {
                        bytes = patched.getBytes(StandardCharsets.UTF_8)
                        changed = true
                    }
                }

                zipOutputStream.write(bytes)
            }

            zipOutputStream.closeEntry()
        }
    } finally {
        zipOutputStream.close()
        zipFile.close()
    }

    if (changed) {
        Files.move(tempPath, file.toPath(), StandardCopyOption.REPLACE_EXISTING)
    } else {
        Files.deleteIfExists(tempPath)
    }

    return changed
}

def patchMcpConfigCaches = {
    def cacheTargets = [
            [
                    root    : new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/de.oceanlabs.mcp/mcp_config"),
                    includes: ['**/*.zip']
            ],
            [
                    root    : new File(gradle.gradleUserHomeDir, "caches/forge_gradle/maven_downloader/de/oceanlabs/mcp/mcp_config"),
                    includes: ['**/*.zip']
            ],
            [
                    root    : new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${rootProject.minecraft_version}/mcp"),
                    includes: ['**/mcp.zip', '**/unpacked/config.json']
            ]
    ]

    cacheTargets.each { target ->
        if (target.root.exists()) {
            fileTree(target.root) {
                target.includes.each { include(it) }
            }.files.each { file ->
                try {
                    if (file.name.endsWith('.zip')) {
                        patchMcpConfigZip(file)
                    } else {
                        patchMcpConfigFile(file)
                    }
                } catch (Exception e) {
                    logger.info("Skipping MCP patch for ${file}: ${e.message}")
                }
            }
        }
    }
}

patchMcpConfigCaches()

def rewriteRepository = { repo ->
    if (!(repo instanceof MavenArtifactRepository)) {
        return
    }

    def rawUrl = repo.url?.toString()
    if (rawUrl == null) {
        return
    }

    def normalizedUrl = rawUrl.endsWith('/') ? rawUrl : "${rawUrl}/"
    def mirrorSources = [
            'https://repo.maven.apache.org/maven2/',
            'https://repo1.maven.org/maven2/',
            'https://maven.fabricmc.net/'
    ]

    if (mirrorSources.contains(normalizedUrl)) {
        repo.url = repositoryMirrorUrl
    }
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    extensions.extraProperties.set("loom_fabric_repository", "https://repo.spongepowered.org/repository/maven-public/")
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    architectury {
        injectInjectables = false
    }

    group = rootProject.mod_group_id
    version = rootProject.mod_version

    base {
        archivesName = rootProject.mod_id
    }

    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.parchmentmc.org'
            content {
                includeGroup 'org.parchmentmc.data'
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = 'https://maven.architectury.dev'
                }
            }
            filter {
                includeGroupByRegex 'dev\\.architectury(\\..+)?'
            }
        }
        maven {
            url = 'https://maven.neoforged.net/releases'
            content {
                includeGroup 'cpw.mods'
                includeGroup 'net.neoforged'
                includeGroupByRegex 'net\\.neoforged(\\..+)?'
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = 'https://maven.creeperhost.net'
                }
            }
            filter {
                includeGroup 'de.oceanlabs.mcp'
                includeGroup 'net.minecraftforge'
            }
        }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }

    repositories.all(rewriteRepository)
    repositories.whenObjectAdded(rewriteRepository)
    buildscript.repositories.all(rewriteRepository)
    buildscript.repositories.whenObjectAdded(rewriteRepository)

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    publishing {
        repositories {
            maven {
                url = uri("${rootProject.projectDir}/repo")
            }
        }
    }
}
